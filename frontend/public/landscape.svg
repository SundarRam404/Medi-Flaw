      <stop offset=".6" stop-color="#f3c6c0"/><stop offset="1" stop-color="#e9b8c4"/>
    </linearGradient>
    <radialGradient id="sun" cx=".62" cy=".28" r=".35">
      <stop offset="0" stop-color="#fff4dc" stop-opacity=".95"/><stop offset="1" stop-color="#fff4dc" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="m1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b98aa6"/><stop offset="1" stop-color="#d9a7a0"/></linearGradient>
    <linearGradient id="m2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9c6f98"/><stop offset=".6" stop-color="#c58f8f"/><stop offset="1" stop-color="#d8a88c"/></linearGradient>
    <linearGradient id="m3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8fa37a"/><stop offset=".5" stop-color="#c5a35f"/><stop offset="1" stop-color="#9aa774"/></linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8b9c3"/><stop offset=".5" stop-color="#d9a3bd"/><stop offset="1" stop-color="#f4e6dc"/></linearGradient>
